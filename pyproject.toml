[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-mcp"
version = "0.2.0"
description = "MCP server for Timeweb Cloud, Selectel, SpaceWeb and Tilda behind one discovery-first interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Vertinsky" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "selectel", "timeweb", "sweb", "spaceweb", "tilda", "cloud", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/AVert/cloud-mcp"
Repository = "https://github.com/AVert/cloud-mcp"
Issues = "https://github.com/AVert/cloud-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
cloud-mcp = "cloud_mcp.__main__:main"
sweb-mcp = "cloud_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"specs" = "cloud_mcp/specs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
