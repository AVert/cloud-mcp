[project]
name = "sweb-mcp"
version = "0.1.0"
description = "MCP server for the SpaceWeb (sweb.ru) JSON-RPC API"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
sweb-mcp = "sweb_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sweb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
