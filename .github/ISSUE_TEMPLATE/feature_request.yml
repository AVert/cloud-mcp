name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the server does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        If this is about a missing API method, check whether it is absent from
        `specs/` (the snapshot of apidoc.sweb.ru) or merely misclassified by
        the safety heuristics — that changes what needs to be fixed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand that methods absent from the API docs snapshot cannot be added until the snapshot is refreshed.
          required: true
